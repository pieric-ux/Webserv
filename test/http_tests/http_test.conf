http {
	types {
		text/html	html htm;
		text/css	css;
		text/plain	txt;
		image/png	png;
	}
	client_max_body_size 10m;
	default_type text/plain;
	error_page 404 /404.html;
	keepalive_timeout 65;
	root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
	enable_cgi on;
	cgi_extensions {
		/usr/bin/python3	.py;
		/bin/bash		.sh
	}
	create_full_put_path on;
	dav_access user:rw;
	dav_methods off;
	dav_put_path: /;

	server {
		client_max_body_size 10m;
		default_type text/plain;
		error_page 404 /404.html;
		keepalive_timeout 65;
		listen 127.0.0.1:8090 default_server;
		root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
		server_name localhost;

		types {
			text/html	html htm;
			text/css	css;
		}
		enable_cgi on;
		cgi_extensions {
			/usr/bin/python3	.py;
			/bin/bash		.sh
		}
		create_full_put_path on;
		dav_access user:rw;
		dav_methods off;
		dav_put_path: /;

		location / {
			autoindex off;
			index index.html;
			allowed_methods GET HEAD POST;
			root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
		}
		location /browse {
			autoindex on;
			allowed_methods GET;
			root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
		}
		location /getonly {
			index index.html;
			allowed_methods GET;
			root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
		}
		location /small {
			client_max_body_size 100;
			allowed_methods GET POST PUT;
			create_full_put_path on;
			dav_access user:rw;
			dav_methods PUT;
			dav_put_path: /uploads;
			root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
		}
		location = /old {
			return 301 http://example.com/new;
		}
		location = /temp {
			return 302 /index.html;
		}
	}
}
