http {
	types { text/html html htm; text/plain txt; }
	client_max_body_size 10m; default_type text/plain; error_page 404 /404.html;
	keepalive_timeout 65; root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www;
	enable_cgi on; cgi_extensions { /usr/bin/python3 .py; /bin/bash .sh; }
	create_full_put_path on; dav_access user:rw; dav_methods off; dav_put_path: /;
	server {
		client_max_body_size 10m; default_type text/plain; error_page 404 /404.html;
		keepalive_timeout 65; listen 127.0.0.1:8091 default_server; root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www; server_name localhost;
		types { text/html html htm; text/plain txt; }
		enable_cgi on; cgi_extensions { /usr/bin/python3 .py; /bin/bash .sh; }
		create_full_put_path on; dav_access user:rw; dav_methods off; dav_put_path: /;
		location / { autoindex off; index index.html; allowed_methods GET HEAD POST; root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www; }
		location /cgi-bin { allowed_methods GET POST; enable_cgi on; client_max_body_size 10M; root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www; }
		location /webdav { autoindex on; allowed_methods GET HEAD PUT DELETE; create_full_put_path on; dav_methods PUT DELETE; dav_access user:rwx; dav_put_path: /Users/blucken/Documents/webserv/Webserv/test/http_tests/www; root /Users/blucken/Documents/webserv/Webserv/test/http_tests/www; }
	}
}
