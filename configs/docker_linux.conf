# Linux-friendly config for Docker testing.
# Paths use the bind-mount /work inside the container.

http {
    types {
        text/html           html htm shtml;
        text/css            css;
        text/plain          txt;
        application/json    json;
        image/png           png;
        image/svg+xml       svg svgz;
        application/octet-stream bin exe dll;
        video/mp4           mp4;
    }

    root /work/www;
    default_type text/html;
    client_max_body_size 2G;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    enable_cgi on;
    cgi_extensions {
        /usr/bin/python3    .py;
        /bin/bash           .sh;
    }

    create_full_put_path on;
    dav_access user:rw group:rw all:r;
    dav_methods PUT DELETE;
    dav_put_path: /work/www/uploads;

    server {
        listen 0.0.0.0:8080 default_server backlog=128;
        server_name localhost;

        location / {
            autoindex on;
            index index.html index.htm default.html;
            allowed_methods GET HEAD POST PUT DELETE;
        }

        location /cgi-bin {
            allowed_methods GET POST;
            enable_cgi on;
            client_max_body_size 10M;
        }

        location /uploads {
            autoindex on;
            allowed_methods GET HEAD POST PUT DELETE;
        }

        location = /old-page {
            return 301 http://example.com/new-page;
        }

        location /legacy {
            return 302 /modern;
        }

        location /gone {
            return 410;
        }
    }
}
