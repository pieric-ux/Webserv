# ============================================================================
# blucken.conf — aligné avec www/, parse-clean
# Inheritable scalars (root, error_page, CGI, DAV, types) live at http {}.
# Locations live inside each server (the parser only reads server-level locs).
# ============================================================================

http {

	io_multiplexer select;

	types {
		text/html                html htm shtml;
		text/css                 css;
		text/plain               txt;
		application/json         json;
		application/javascript   js;
		image/png                png;
		image/jpeg               jpg jpeg;
		image/svg+xml            svg svgz;
		application/octet-stream bin exe dll;
		video/mp4                mp4;
	}

	# ── Defaults inherited by every server (scalars only) ──────────────────
	root /Users/blucken/Documents/webserv/Webserv/www;
	default_type text/html;
	client_max_body_size 2G;
	keepalive_timeout 60;

	error_page 404 /404.html;
	error_page 500 502 503 504 /50x.html;

	enable_cgi on;
	cgi_extensions {
		/usr/bin/python3	.py;
		/bin/bash		.sh;
	}

	create_full_put_path on;
	dav_access user:rw group:rw all:r;
	dav_methods PUT DELETE;
	dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/uploads;

	# ========================================================================
	# Server template — same body, different ports (8080-8084)
	# Locations are duplicated per-server because the parser reads
	# location-block only inside server-block (Parser.cpp:120).
	# ========================================================================

	server {
		listen localhost:8080 default_server backlog=128 rcvbuf=8K sndbuf=16k ipv6only=off reuseport so_keepalive=on;
		server_name localhost;

		location /api {
			default_type application/json;
			allowed_methods GET POST;
			error_page 404 /api/not-found.html;
		}

		location /app {
			index index.html;
			allowed_methods GET HEAD POST PUT DELETE;

			location /app/uploads {
				allowed_methods GET POST PUT;
				autoindex on;
				dav_methods PUT;
				dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/app/uploads;
			}
		}

		location /static {
			allowed_methods GET HEAD;
			autoindex on;
		}

		location /cgi-bin {
			allowed_methods GET POST;
			enable_cgi on;
			client_max_body_size 10M;
		}

		location /webdav {
			autoindex on;
			allowed_methods GET HEAD PUT DELETE;
			create_full_put_path on;
			dav_methods PUT DELETE;
			dav_access user:rwx group:rx all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/webdav/uploads;
			error_page 404 /webdav/not-found.html;
			error_page 403 /webdav/forbidden.html;
		}

		location /uploads {
			autoindex on;
			allowed_methods GET HEAD POST PUT DELETE;
		}

		location = /old-page {
			return 301 http://example.com/new-page;
		}

		location /legacy {
			return 302 /modern;
		}

		location /gone {
			return 410;
		}

		location / {
			autoindex on;
			index index.html index.htm default.html;
			allowed_methods GET HEAD POST PUT DELETE;
		}
	}

