# ==========================================================================
# test_locations.conf — Location matching : exact, ^~, prefix, nested
# Tests couverts : 18.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
		text/css          css;
		application/javascript js;
		application/json  json;
	}

	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Catch-all prefix
		location / {
			allowed_methods GET HEAD POST;
			index index_test.html;
			autoindex on;
		}

		# Exact match — priorité maximale
		location = /test.txt {
			allowed_methods GET;
			default_type text/plain;
		}

		# ^~ prefix — priorité sur prefix normal
		location ^~ /static {
			allowed_methods GET HEAD;
			autoindex on;
			default_type application/octet-stream;
		}

		# Prefix normal /api
		location /api {
			allowed_methods GET HEAD POST;
			default_type application/json;
			index index.json;
		}

		# Prefix plus long /api/v2 — devrait gagner sur /api
		location /api/v2 {
			allowed_methods GET;
			default_type application/json;
		}

		# Nested locations
		location /app {
			allowed_methods GET HEAD POST;
			index index.html;
			autoindex off;
			client_max_body_size 100k;

			location /app/uploads {
				allowed_methods GET HEAD PUT DELETE;
				autoindex on;
				dav_methods PUT DELETE;
				dav_access user:rw group:rw all:r;
				dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
				create_full_put_path on;
				client_max_body_size 5m;
			}
		}
	}
}
