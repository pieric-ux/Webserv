# ==========================================================================
# test_dav_off.conf — DAV desactivé + create_full_put_path OFF
# Tests couverts : 5.7, 5.11, 6.6
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	client_max_body_size 1m;
	default_type application/octet-stream;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# DAV désactivé partout
		dav_methods off;

		location / {
			allowed_methods GET HEAD POST PUT DELETE;
			index index_test.html;
			autoindex on;
		}

		# Uploads — DAV off explicite
		location /uploads {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods off;
		}
	}
}
