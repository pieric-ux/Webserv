# ==========================================================================
# test_robust.conf — Requetes malformees, URI, path traversal, robustesse
# Tests couverts : 9.*, 12.*, 13.*, 22.*, 23.*, 27.*, 28.*
# Config minimaliste pour isoler le comportement du serveur
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 10;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		location / {
			allowed_methods GET HEAD POST PUT DELETE;
			index index_test.html;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
		}
	}
}
