# ==========================================================================
# test_dav_cfpp_off.conf — DAV ON mais create_full_put_path OFF
# Tests couverts : 5.7 (PUT nested → 500)
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	client_max_body_size 10m;
	default_type application/octet-stream;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}

		# DAV ON mais pas de création de chemins intermédiaires
		location /uploads {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path off;
		}
	}
}
