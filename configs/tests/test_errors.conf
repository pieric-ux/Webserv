# ==========================================================================
# test_errors.conf — Error pages personnalisees a differents niveaux
# Tests couverts : 16.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 30;

	# Error pages au niveau http (héritage)
	error_page 404 /404.html;
	error_page 500 502 503 504 /50x.html;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Override au niveau server — 404 custom
		error_page 404 /custom-404.html;

		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}

		# API avec sa propre error page
		location /api {
			allowed_methods GET HEAD;
			default_type application/json;
			error_page 404 /api/not-found.html;
		}

		# WebDAV avec error pages spécifiques
		location /webdav {
			allowed_methods GET HEAD PUT DELETE;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
			autoindex on;
			error_page 404 /webdav/not-found.html;
			error_page 403 /webdav/forbidden.html;
		}

		# Location avec error_page qui pointe vers fichier inexistant
		location /noindex {
			allowed_methods GET HEAD;
			autoindex off;
			error_page 403 /missing-error-page.html;
		}
	}
}
