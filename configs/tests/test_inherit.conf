# ==========================================================================
# test_inherit.conf — Heritage de configuration http → server → location
# Tests couverts : 21.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	# ── Valeurs http (héritées partout sauf override) ─────────────────────
	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 120;
	error_page 404 /404.html;
	error_page 500 502 503 504 /50x.html;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Override server : timeout plus court
		keepalive_timeout 30;
		# Override server : error page custom
		error_page 404 /custom-404.html;

		# Location sans override → hérite server (et http)
		location / {
			allowed_methods GET HEAD POST;
			index index_test.html;
			autoindex on;
			# client_max_body_size hérite de http : 1m
			# keepalive_timeout hérite de server : 30
			# error_page 404 hérite de server : /custom-404.html
		}

		# Location avec override local
		location /uploads {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;

			# Override location
			client_max_body_size 10k;
			keepalive_timeout 5;
			default_type application/octet-stream;
		}

		# Location avec default_type override
		location /api {
			allowed_methods GET HEAD;
			default_type application/json;
			index index.json;
			# client_max_body_size hérite : 1m
			# keepalive_timeout hérite server : 30
		}
	}

	# ── Server 2 : hérite tout du http ────────────────────────────────────
	server {
		listen localhost:8081;
		server_name other.local;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Pas d'override : hérite http level
		# client_max_body_size : 1m
		# keepalive_timeout : 120
		# default_type : text/plain
		# error_page 404 : /404.html (pas custom-404)

		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}
	}
}
