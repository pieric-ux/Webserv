# ==========================================================================
# test_return.conf — Directive return (redirections et status fixes)
# Tests couverts : 17.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Racine normale
		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}

		# 301 Moved Permanently vers URL absolue
		location = /old-page {
			return 301 http://localhost:8080/;
		}

		# 302 Found vers chemin relatif
		location /legacy {
			return 302 /static/hello.txt;
		}

		# 410 Gone sans URL
		location /gone {
			return 410;
		}

		# 200 OK — health check
		location = /health {
			return 200;
		}

		# 308 Permanent Redirect
		location /moved {
			return 308 http://localhost:8080/static/;
		}

		# return a priorité sur fichier existant
		# /test.txt existe mais cette location intercepte
		location = /test.txt {
			return 301 http://localhost:8080/static/hello.txt;
		}
	}
}
