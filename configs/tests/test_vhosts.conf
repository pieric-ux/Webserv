# ==========================================================================
# test_vhosts.conf — Virtual hosts, multi-port, server_name, default_server
# Tests couverts : 19.*, 20.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
		application/json  json;
	}

	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 30;

	# ── Server 1 : default sur port 8080 ──────────────────────────────────
	server {
		listen localhost:8080 default_server;
		server_name default.local;
		root /Users/blucken/Documents/webserv/Webserv/www;

		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}
	}

	# ── Server 2 : même port, server_name différent ───────────────────────
	server {
		listen localhost:8080;
		server_name example.com www.example.com;
		root /Users/blucken/Documents/webserv/Webserv/www/app;

		location / {
			allowed_methods GET HEAD;
			index index.html;
			autoindex off;
		}
	}

	# ── Server 3 : même port, autre server_name ──────────────────────────
	server {
		listen localhost:8080;
		server_name api.local;
		root /Users/blucken/Documents/webserv/Webserv/www/api;

		default_type application/json;

		location / {
			allowed_methods GET HEAD POST;
			index index.json;
		}
	}

	# ── Server 4 : port différent (8081) ──────────────────────────────────
	server {
		listen localhost:8081;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www/static;

		location / {
			allowed_methods GET HEAD;
			autoindex on;
		}
	}
}
