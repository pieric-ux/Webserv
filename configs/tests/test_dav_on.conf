# ==========================================================================
# test_dav_on.conf — PUT/DELETE avec WebDAV activé, create_full_put_path ON
# Tests couverts : 5.1-5.10, 5.12-5.14, 6.*, 24.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
		application/octet-stream bin;
	}

	client_max_body_size 10m;
	default_type application/octet-stream;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Location racine — lecture seule
		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}

		# Uploads — DAV complet, create_full_put_path ON
		location /uploads {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
			client_max_body_size 10m;
		}

		# WebDAV — dossier dédié
		location /webdav {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rwx group:rx all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
		}
	}
}
