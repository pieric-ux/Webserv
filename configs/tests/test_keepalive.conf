# ==========================================================================
# test_keepalive.conf — Keep-alive, timeouts, connexions persistantes
# Tests couverts : 14.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	client_max_body_size 1m;
	default_type text/plain;

	# Timeout très court pour tester facilement les déconnexions
	keepalive_timeout 5;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		location / {
			allowed_methods GET HEAD;
			index index_test.html;
			autoindex on;
		}

		# Location avec timeout plus long
		location /static {
			allowed_methods GET HEAD;
			autoindex on;
			keepalive_timeout 60;
		}
	}
}
