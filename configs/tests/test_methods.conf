# ==========================================================================
# test_methods.conf — Controle des methodes par location
# Tests couverts : 4.*, 7.*, 8.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
		application/json  json;
	}

	client_max_body_size 1m;
	default_type text/plain;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# GET uniquement
		location / {
			allowed_methods GET;
			index index_test.html;
			autoindex on;
		}

		# GET + HEAD uniquement
		location /static {
			allowed_methods GET HEAD;
			autoindex on;
		}

		# GET + POST
		location /api {
			allowed_methods GET POST;
			default_type application/json;
			index index.json;
		}

		# Toutes les méthodes
		location /uploads {
			allowed_methods GET HEAD POST PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
		}

		# POST seulement (bizarre mais testable)
		location /app {
			allowed_methods POST;
			index index.html;
		}
	}
}
