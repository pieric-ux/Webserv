# ==========================================================================
# test_base.conf — GET, HEAD, fichiers statiques, autoindex, index, errors
# Tests couverts : 1.*, 2.*, 3.*, 10.*, 11.*, 25.*
# ==========================================================================

http {

	types {
		text/html            html htm;
		text/css             css;
		text/plain           txt;
		application/json     json;
		application/javascript js;
		image/png            png;
		image/jpeg           jpg jpeg;
		application/octet-stream bin exe;
	}

	client_max_body_size 1m;
	default_type application/octet-stream;
	keepalive_timeout 65;
	error_page 404 /404.html;
	error_page 500 502 503 504 /50x.html;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		# Location racine — autoindex ON, index configuré
		location / {
			allowed_methods GET HEAD POST;
			index index_test.html;
			autoindex on;
		}

		# Static — autoindex ON, GET/HEAD only
		location /static {
			allowed_methods GET HEAD;
			autoindex on;
		}

		# API — JSON par défaut
		location /api {
			allowed_methods GET HEAD;
			default_type application/json;
			index index.json;
		}

		# Dossier sans index ni autoindex → 403
		location /noindex {
			allowed_methods GET HEAD;
			autoindex off;
		}

		# App — index.html configuré
		location /app {
			allowed_methods GET HEAD;
			index index.html;
			autoindex off;
		}
	}
}
