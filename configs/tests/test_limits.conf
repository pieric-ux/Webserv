# ==========================================================================
# test_limits.conf — client_max_body_size a differents niveaux
# Tests couverts : 15.*
# ==========================================================================

http {

	types {
		text/html         html htm;
		text/plain        txt;
	}

	# Limite globale : 1k (1024 octets)
	client_max_body_size 1k;
	default_type text/plain;
	keepalive_timeout 30;

	server {
		listen localhost:8080;
		server_name localhost;
		root /Users/blucken/Documents/webserv/Webserv/www;

		location / {
			allowed_methods GET HEAD POST;
			index index_test.html;
			autoindex on;
			# Hérite de 1k du http block
		}

		# Tiny limit — 100 octets
		location /uploads/tiny {
			allowed_methods GET HEAD PUT DELETE;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
			client_max_body_size 100;
		}

		# Normal limit — 10k
		location /uploads {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
			client_max_body_size 10k;
		}

		# Big limit — 10M
		location /webdav {
			allowed_methods GET HEAD PUT DELETE;
			autoindex on;
			dav_methods PUT DELETE;
			dav_access user:rw group:rw all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www;
			create_full_put_path on;
			client_max_body_size 10M;
		}
	}
}
