# ============================================================================
# Comprehensive webserv configuration - exercises every grammar rule
# ============================================================================

http {

	# ── Types block (http level) ────────────────────────────────────────────
	types {
		text/html           html htm shtml;
		text/css            css;
		text/plain          txt;
		application/json    json;
		image/png           png;
		image/svg+xml       svg svgz;
		application/octet-stream bin exe dll;
		video/mp4           mp4;
	}

	# ========================================================================
	# Server 1 - full-featured, all listen variants
	# ========================================================================
	server {

		# ── Listen variants ─────────────────────────────────────────────────
		# hostname:port with all options
		listen localhost:8080 default_server backlog=512 rcvbuf=8K sndbuf=16k ipv6only=off reuseport so_keepalive=on;
		server_name example.com www.example.com api.example.com;

		root /Users/id/Documents/Ecole42/Cursus/webserv/www;

		# ── Location: exact match ───────────────────────────────────────────
		location / {
			client_max_body_size 2G;
			allowed_methods GET HEAD POST PUT DELETE;
			root /Users/id/Documents/Ecole42/Cursus/webserv/www;
			index index.html index.htm default.html;
			default_type text/html;
			autoindex on;

			dav_access user:rw group:rw all:r;
			dav_methods PUT DELETE;
			dav_put_path: /Users/id/Documents/Ecole42/Cursus/webserv/www/uploads;
		}

		location /cgi-bin {
			allowed_methods GET POST;
			enable_cgi on;
			client_max_body_size 10M;
		}
	}
}
