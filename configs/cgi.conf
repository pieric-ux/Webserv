# Minimal CGI test config — used by the curl tests in CGI_TUTORIAL.md.
# Listens on 127.0.0.1:9090 with a single /cgi-bin/ location.

http {

	types {
		text/html           html htm;
		text/css            css;
		text/plain          txt;
		application/octet-stream bin;
	}

	server {

		listen 127.0.0.1:9090 default_server;
		server_name webserv;

		location / {
			client_max_body_size 2M;
			allowed_methods GET HEAD POST PUT DELETE;
			root /Users/blucken/Documents/webserv/Webserv/www;
			index index.html;
			default_type text/html;
			autoindex on;
		}

		location /cgi-bin/ {
			client_max_body_size 2M;
			allowed_methods GET HEAD POST PUT DELETE;
			root /Users/blucken/Documents/webserv/Webserv/www;
			default_type text/plain;
			autoindex off;

			enable_cgi on;
			cgi_extensions {
				/usr/bin/python3	.py;
				/bin/sh				.sh
			}
		}
	}
}
