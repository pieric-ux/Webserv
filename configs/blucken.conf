# ============================================================================
# Comprehensive webserv configuration - exercises every grammar rule
# ============================================================================

http {

	# ── Types block (http level) ────────────────────────────────────────────
	types {
		text/html           html htm shtml;
		text/css            css;
		text/plain          txt;
		application/json    json;
		image/png           png;
		image/svg+xml       svg svgz;
		application/octet-stream bin exe dll;
		video/mp4           mp4;
	}

	# ── All http-level directives ───────────────────────────────────────────
	io_multiplexer select;
	client_max_body_size 1k;
	default_type application/octet-stream;
	keepalive_timeout 120;
	root /Users/blucken/Documents/webserv/Webserv/www;
	error_page 404 /404.html;
	error_page 500 502 503 504 /50x.html;

	# ── CGI at http level ───────────────────────────────────────────────────
	enable_cgi on;
	cgi_extension .py /usr/bin/python3;
	cgi_extensions {
		/usr/bin/python3	.py;
		/usr/bin/bash		.sh;
		/usr/bin/php		.php
	}

	# ── DAV at http level ───────────────────────────────────────────────────
	create_full_put_path on;
	dav_access user:rw group:rw all:r;
	dav_methods PUT DELETE;
	dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/uploads;

	# ── Location at http level ──────────────────────────────────────────────
	location = /50x.html {
		root /Users/blucken/Documents/webserv/Webserv/www;
	}

	server {

		# ── Listen variants ─────────────────────────────────────────────────
		# hostname:port with all options
		listen localhost:8080;
		server_name example.com www.example.com api.example.com;

		# ── Server-level directives ─────────────────────────────────────────
		root /Users/blucken/Documents/webserv/Webserv/www;
		client_max_body_size 50m;
		keepalive_timeout 120;
		default_type text/html;
		error_page 404 /custom-404.html;
		error_page 500 503 /maintenance.html;

		types {
			text/html  html htm;
			text/css   css;
		}

		enable_cgi on;
		cgi_extension .cgi /usr/lib/cgi-bin;
		cgi_extensions {
			/usr/bin/ruby	.rb;
			/usr/bin/perl	.pl
		}

		create_full_put_path off;
		dav_access user:rwx;
		dav_methods off;
		dav_put_path: /var/dav;

		# ── Location: exact match ───────────────────────────────────────────
		location = / {
			root /Users/blucken/Documents/webserv/Webserv/www;
			index index.html index.htm default.html;
			autoindex on;
		}

		# ── Location: prefix match (no modifier) ───────────────────────────
		location /api {
			allowed_methods GET POST;
			client_max_body_size 2M;
			default_type application/json;
			keepalive_timeout 10;
			root /Users/blucken/Documents/webserv/Webserv/www/api;
			error_page 404 /api/not-found.html;
			enable_cgi on;
			cgi_extension .py /usr/bin/python3;
			dav_access user:rw group:r;
			dav_methods PUT DELETE;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/api/uploads;
		}

		# ── Location: ^~ modifier ──────────────────────────────────────────
		location ^~ /static {
			root /Users/blucken/Documents/webserv/Webserv/www/static;
			autoindex on;
			allowed_methods GET HEAD;
			keepalive_timeout 300;
			default_type application/octet-stream;
			types {
				text/css         css;
				application/javascript js;
				image/png        png;
				image/jpeg       jpg jpeg;
			}
		}

		# ── Location: return variants ──────────────────────────────────────
		location = /old-page {
			return 301 http://example.com/new-page;
		}

		location /legacy {
			return 302 /modern;
		}

		location /gone {
			return 410;
		}

		# ── Location: nested locations ─────────────────────────────────────
		location /app {
			root /Users/blucken/Documents/webserv/Webserv/www/app;
			index index.html;
			allowed_methods GET POST PUT DELETE;
			client_max_body_size 100k;
			autoindex on;

			location /app/uploads {
				allowed_methods POST PUT;
				client_max_body_size 500M;
				dav_methods PUT DELETE;
				dav_access user:rw group:rw;
				dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/app/uploads;
				autoindex on;
			}

			location = /app/health {
				return 200;
				allowed_methods GET;
			}
		}

		# ── Location: CGI heavy ────────────────────────────────────────────
		location /cgi-bin {
			root /Users/blucken/Documents/webserv/Webserv/www/cgi-bin;
			enable_cgi on;
			cgi_extensions {
				/usr/bin/python3	.py;
				/usr/bin/bash		.sh;
				/usr/bin/php		.php;
				/usr/bin/ruby		.rb
			}
			allowed_methods GET POST;
			client_max_body_size 1G;
		}

		# ── Location: all DAV features ─────────────────────────────────────
		location /webdav {
			root /Users/blucken/Documents/webserv/Webserv/www/webdav;
			autoindex on;
			allowed_methods GET PUT DELETE;
			dav_methods PUT DELETE;
			dav_access user:rwx group:rx all:r;
			dav_put_path: /Users/blucken/Documents/webserv/Webserv/www/webdav/uploads;
			client_max_body_size 2G;
			error_page 404 /webdav/not-found.html;
			error_page 403 /webdav/forbidden.html;
			default_type application/octet-stream;
			keepalive_timeout 600;
		}
	}
}
	